<!-- JAVASCRIPT -->
<script>
    const roleConfig = {
      teacher: {
        label: "Correo institucional o RUT / ID",
        placeholder: "ej. clara@edunova.cl",
        activeClass: "bg-surface-container-lowest text-primary shadow-sm"
      },
      staff: {
        label: "Correo institucional o RUT / ID",
        placeholder: "ej. rodolfo@establecimiento.cl",
        activeClass: "bg-surface-container-lowest text-primary shadow-sm"
      },
      parent: {
        label: "Teléfono registrado o Correo del Apoderado/a",
        placeholder: "ej. +56 9 1234 5678",
        activeClass: "bg-surface-container-lowest text-primary shadow-sm"
      }
    };

    function selectRole(role) {
      const tabs = ['teacher', 'staff', 'parent'];
      tabs.forEach(t => {
        const btn = document.getElementById(`tab-${t}`);
        if (t === role) {
          btn.className = `role-tab flex-1 py-2 text-center rounded-full text-label-md font-label-md transition-all duration-200 ${roleConfig[role].activeClass}`;
          btn.setAttribute('aria-selected', 'true');
        } else {
          btn.className = "role-tab flex-1 py-2 text-center rounded-full text-label-md font-label-md transition-all duration-200 text-on-surface-variant hover:text-on-surface";
          btn.setAttribute('aria-selected', 'false');
        }
      });

      const label = document.getElementById('label-identifier');
      const input = document.getElementById('identifier');
      label.textContent = roleConfig[role].label;
      input.placeholder = roleConfig[role].placeholder;
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('pwdIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pwd.type = 'password';
        icon.textContent = 'visibility';
      }
    }
  </script>
